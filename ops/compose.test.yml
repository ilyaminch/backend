# Disposable test DB only. No production data or credentials.
services:
  db-test:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: gis_test
      POSTGRES_USER: gis_test
      POSTGRES_PASSWORD: disposable_local_only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis_test -d gis_test"]
      interval: 2s
      timeout: 3s
      retries: 30
