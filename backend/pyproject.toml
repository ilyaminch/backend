[project]
name = "gis-assistant-backend"
version = "0.1.0"
description = "API ГИС-помощника"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "asyncpg>=0.30,<1", "geoalchemy2>=0.17,<1", "alembic>=1.14,<2",
  "httpx>=0.28,<1", "argon2-cffi>=23.1,<26",
  "python-multipart>=0.0.20,<0.1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "allure-pytest>=2.13,<3", "ruff>=0.9,<1", "mypy>=1.15,<2", "build>=1.2,<2", "pyyaml>=6,<7", "types-PyYAML>=6,<7"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers --tb=short --alluredir=reports/allure/local --clean-alluredir"
markers = ["ci: проверки конфигурации GitLab CI без обращения к серверу"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
